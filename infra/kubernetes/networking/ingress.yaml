apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ongsec
  namespace: ongsec
spec:
  ingressClassName: nginx
  rules:
    - host: ongsec.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
