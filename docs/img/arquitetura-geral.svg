<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="720" fill="#f8fafc"/>

  <!-- Título -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ONGSec (NeuraBase) — Arquitetura Distribuída</text>
  <text x="600" y="55" text-anchor="middle" font-size="12.5" fill="#475569">Gateway + 2 BFFs + Orquestrador SAGA Dedicado + 4 Microsserviços de Domínio (Database per Service)</text>

  <!-- Camada 1: Clientes -->
  <rect x="210" y="75" width="230" height="58" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="325" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Painel Web de Gestão</text>
  <text x="325" y="119" text-anchor="middle" font-size="11.5" fill="#475569">SPA (Gestores &amp; Auditores)</text>

  <rect x="760" y="75" width="230" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="875" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">App / Portal Público</text>
  <text x="875" y="119" text-anchor="middle" font-size="11.5" fill="#475569">Doadores &amp; Cidadãos (Anônimo)</text>

  <!-- Camada 2: API Gateway -->
  <rect x="370" y="165" width="460" height="56" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="600" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">API Gateway (Nginx • Porta 8080)</text>
  <text x="600" y="209" text-anchor="middle" font-size="11.5" fill="#cbd5e1">Roteamento (/api/gestao/*, /api/publico/*, /gestao/*) • Rate Limit • X-Correlation-ID</text>

  <line x1="325" y1="133" x2="480" y2="165" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="875" y1="133" x2="720" y2="165" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Camada 3: BFFs -->
  <rect x="210" y="255" width="260" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="340" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">BFF Gestão</text>
  <text x="340" y="300" text-anchor="middle" font-size="11.5" fill="#0369a1">JWT • Agregação • HATEOAS</text>

  <rect x="730" y="255" width="260" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="860" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">BFF Público</text>
  <text x="860" y="300" text-anchor="middle" font-size="11.5" fill="#15803d">Sem JWT • Payload Enxuto (CQRS)</text>

  <line x1="500" y1="221" x2="365" y2="255" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="700" y1="221" x2="835" y2="255" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Camada 4: Orquestrador SAGA dedicado -->
  <rect x="380" y="345" width="440" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
  <text x="600" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Orquestrador SAGA (saga-orchestrator)</text>
  <text x="600" y="389" text-anchor="middle" font-size="11" fill="#92400e">Serviço Dedicado • Coordena Audit → Task → Badge (202 / Compensação)</text>

  <line x1="390" y1="315" x2="475" y2="345" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Caixa Rede Interna -->
  <rect x="45" y="425" width="1110" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="65" y="447" font-size="12" font-weight="700" fill="#475569">Microsserviços de Domínio + Bancos Isolados (Database per Service)</text>

  <!-- Setas BFFs -> Serviços (desviando do orquestrador) -->
  <line x1="250" y1="315" x2="175" y2="465" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="295" y1="315" x2="420" y2="465" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 330 315 Q 350 415 695 465" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="880" y1="315" x2="1015" y2="465" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Setas Orquestrador -> Audit, Task, Badge -->
  <line x1="520" y1="403" x2="475" y2="465" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <line x1="650" y1="403" x2="725" y2="465" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <line x1="720" y1="403" x2="985" y2="465" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

  <!-- Serviço 1: org-service + org-db (barril) -->
  <rect x="75" y="465" width="210" height="68" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <text x="180" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">org-service</text>
  <text x="180" y="513" text-anchor="middle" font-size="11" fill="#475569">ONGs, Usuários &amp; JWT</text>
  <line x1="180" y1="533" x2="180" y2="567" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Barril org-db -->
  <g transform="translate(180, 578)">
    <path d="M -52 12 L -52 72 A 52 13 0 0 0 52 72 L 52 12 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="0" cy="12" rx="52" ry="13" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <path d="M -52 32 A 52 13 0 0 0 52 32" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
    <text x="0" y="53" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">org-db</text>
    <text x="0" y="69" text-anchor="middle" font-size="10.5" fill="#0369a1">PostgreSQL 16</text>
  </g>

  <!-- Serviço 2: audit-service + audit-db (barril) -->
  <rect x="355" y="465" width="210" height="68" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">audit-service</text>
  <text x="460" y="513" text-anchor="middle" font-size="11" fill="#475569">Questionários, Score &amp; Outbox</text>
  <line x1="460" y1="533" x2="460" y2="567" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Barril audit-db -->
  <g transform="translate(460, 578)">
    <path d="M -52 12 L -52 72 A 52 13 0 0 0 52 72 L 52 12 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <ellipse cx="0" cy="12" rx="52" ry="13" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <path d="M -52 32 A 52 13 0 0 0 52 32" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.6"/>
    <text x="0" y="53" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">audit-db</text>
    <text x="0" y="69" text-anchor="middle" font-size="10.5" fill="#6d28d9">PostgreSQL 16</text>
  </g>

  <!-- Serviço 3: task-service + task-db (barril) -->
  <rect x="635" y="465" width="210" height="68" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
  <text x="740" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">task-service</text>
  <text x="740" y="513" text-anchor="middle" font-size="11" fill="#475569">Planos, Tarefas &amp; Outbox</text>
  <line x1="740" y1="533" x2="740" y2="567" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Barril task-db -->
  <g transform="translate(740, 578)">
    <path d="M -52 12 L -52 72 A 52 13 0 0 0 52 72 L 52 12 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="0" cy="12" rx="52" ry="13" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <path d="M -52 32 A 52 13 0 0 0 52 32" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.6"/>
    <text x="0" y="53" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">task-db</text>
    <text x="0" y="69" text-anchor="middle" font-size="10.5" fill="#b45309">PostgreSQL 16</text>
  </g>

  <!-- Serviço 4: badge-service + badge-db (barril) -->
  <rect x="915" y="465" width="210" height="68" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">badge-service</text>
  <text x="1020" y="513" text-anchor="middle" font-size="11" fill="#475569">Selos, Outbox &amp; CQRS Leitura</text>
  <line x1="1020" y1="533" x2="1020" y2="567" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Barril badge-db -->
  <g transform="translate(1020, 578)">
    <path d="M -58 12 L -58 72 A 58 13 0 0 0 58 72 L 58 12 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <ellipse cx="0" cy="12" rx="58" ry="13" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <path d="M -58 32 A 58 13 0 0 0 58 32" fill="none" stroke="#16a34a" stroke-width="1.2" opacity="0.6"/>
    <text x="0" y="53" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">badge-db</text>
    <text x="0" y="69" text-anchor="middle" font-size="9.5" fill="#15803d">PostgreSQL 16 (CQRS)</text>
  </g>
</svg>
