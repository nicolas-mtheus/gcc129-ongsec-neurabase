apiVersion: apps/v1
kind: Deployment
metadata:
  name: org-service
  namespace: ongsec
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: org-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: org-service
    spec:
      containers:
        - name: org-service
          image: ongsec/org-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ongsec-app-config
                  key: ORG_DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ongsec-app-config
                  key: ORG_DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ongsec-app-config
                  key: ORG_DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ongsec-app-config
                  key: ORG_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: org-db-credentials
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ongsec-app-credentials
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: org-service
  namespace: ongsec
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: org-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
