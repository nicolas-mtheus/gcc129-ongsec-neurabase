user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'correlation_id="$correlation_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Defesa de Borda: Políticas de Rate Limiting por IP (docs/gateway-bffs.md)
    limit_req_zone $binary_remote_addr zone=publico_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=gestao_limit:10m rate=30r/s;
    limit_req_status 429;

    # Rastreabilidade Distribuída (Tracing): Injeção/Propagação de X-Correlation-ID
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    upstream web_gestao_backend {
        server web-gestao:80;
    }

    upstream bff_gestao_backend {
        server bff-gestao:8000;
    }

    upstream bff_publico_backend {
        server bff-publico:8000;
    }

    server {
        listen 80;
        server_name localhost;
        absolute_redirect off;

        # Segurança de Borda (Headers)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Verificação de borda (Healthcheck do Gateway)
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"healthy"}';
        }

        # Painel Web de Gestão
        location /gestao/ {
            proxy_pass http://web_gestao_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            add_header X-Correlation-ID $correlation_id always;
        }

        location = /gestao {
            return 301 /gestao/;
        }

        # BFF Gestão (Rotas protegidas com JWT)
        location /api/gestao/ {
            limit_req zone=gestao_limit burst=50 nodelay;

            proxy_pass http://bff_gestao_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            add_header X-Correlation-ID $correlation_id always;
        }

        # BFF Público (Consulta anônima de selos)
        location /api/publico/ {
            limit_req zone=publico_limit burst=20 nodelay;

            proxy_pass http://bff_publico_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            add_header X-Correlation-ID $correlation_id always;
        }
    }
}
