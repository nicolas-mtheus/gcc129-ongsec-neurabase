server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Health check do Painel Web
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }
}

