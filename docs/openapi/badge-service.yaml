openapi: 3.0.3
info:
  title: ONGSec badge-service
  version: 1.0.0
  description: >
    Emissão e revogação do selo. A escrita é a solicitação (`/v1/solicitacoes`).
    A leitura pública é `GET /v1/consulta/organizacoes/{ongId}`, cujo corpo é
    o mesmo JSON do BFF Público. Esse GET interno não é rota do gateway.
    A solicitação expõe HATEOAS, inclusive o link de revogação que o BFF
    Gestão traduz para `/api/gestao/selos/{ongId}/revogar`.
servers:
  - url: http://badge-service:8080
    description: Rede interna. Não é publicado no API Gateway.
tags:
  - name: consulta
  - name: selos
paths:
  /v1/selos:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags: [selos]
      operationId: emitirSelo
      summary: Emite um selo digital
      description: >
        Chamado pelo `saga-orchestrator` depois de confirmar o diagnóstico
        e o plano de tarefas. Grava o selo e o evento `SELO_GERADO` na outbox.
        O cabeçalho `X-Simular-Falha: true` provoca erro 500 para demonstrar
        a compensação da SAGA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ong_id, solicitacao_id, nome_instituicao]
              properties:
                ong_id:
                  type: string
                solicitacao_id:
                  type: string
                nome_instituicao:
                  type: string
                cnpj:
                  type: string
            example:
              ong_id: ong-123
              solicitacao_id: sol-998
              nome_instituicao: Associação Cuidar
      responses:
        '201':
          description: Selo emitido com status ATIVO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selo'
        '500':
          description: Falha na gravação do selo (a SAGA executa a compensação).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
  /v1/organizacoes/{ongId}/revogacao:
    parameters:
      - $ref: '#/components/parameters/OngId'
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags: [selos]
      operationId: revogarSeloPorOrganizacao
      summary: Revoga o selo mais recente da organização
      responses:
        '200':
          description: Selo revogado. A consulta pública passa a REVOGADO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selo'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Selo já revogado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
    /v1/consulta/organizacoes:
    get:
      tags: [consulta]
      operationId: listarConsultaPublica
      summary: Lista os selos no modelo de leitura (CQRS)
      description: Consulta pública, sem login. Aceita busca por nome, ID da ONG, ID do selo ou CNPJ.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de selos públicos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /v1/consulta/organizacoes/{ongId}:
    parameters:
      - $ref: '#/components/parameters/OngId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [consulta]
      operationId: consultarSeloPublico
      summary: Lê a projeção pública do selo
      security: []
      description: >
        Modelo de leitura. O corpo é o mesmo de `GET /api/publico/selos/{ongId}`.
        Não exige JWT de usuário: quem autentica a borda pública é o gateway,
        por rate limit, e só o BFF Público chama este caminho. Não publica
        score, responsável legal nem tarefas.
      responses:
        '200':
          description: Projeção pública. Pode estar ATIVO ou REVOGADO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaPublica'
              example:
                id_selo: CERT-2026-998
                ong_id: ong-123
                nome_instituicao: Associação Cuidar
                status_conformidade: ATIVO
                emitido_em: "2026-10-10T14:00:00Z"
                mensagem: Instituição verificada e em conformidade com as diretrizes da LGPD.
        '404':
          description: A organização não possui selo na projeção de leitura.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
  /v1/organizacoes/{ongId}/certificacao:
    parameters:
      - $ref: '#/components/parameters/OngId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [selos]
      operationId: obterCertificacao
      summary: Lê o selo com o histórico da emissão
      description: >
        Fonte, no badge-service, dos campos `id_selo`, `status_conformidade`
        e `historico_saga_emissao` do BFF Gestão. Não inclui score nem
        tarefas: esses campos vêm dos outros serviços.
      responses:
        '200':
          description: Certificação da organização.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificacao'
              example:
                id_selo: CERT-2026-998
                ong_id: ong-123
                status_conformidade: ATIVO
                emitido_em: "2026-10-10T14:00:00Z"
                historico_saga_emissao:
                  - evento: DIAGNOSTICO_CONCLUIDO
                    servico: audit-service
                    sucesso: true
                  - evento: TAREFAS_REMEDIADAS
                    servico: task-service
                    sucesso: true
                  - evento: SELO_GERADO
                    servico: badge-service
                    sucesso: true
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /v1/selos/{seloId}:
    parameters:
      - $ref: '#/components/parameters/SeloId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [selos]
      operationId: obterSelo
      summary: Obtém o selo pelo identificador de escrita
      responses:
        '200':
          description: Selo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /v1/selos/{seloId}/revogacao:
    parameters:
      - $ref: '#/components/parameters/SeloId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [selos]
      operationId: revogarSelo
      summary: Revoga um selo ativo
      description: >
        Destino interno do link `revogar_selo` do BFF Gestão
        (`POST /api/gestao/selos/{ongId}/revogar`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
            example:
              motivo: Não conformidade reaberta pela gestora.
      responses:
        '200':
          description: Selo revogado. A consulta pública passa a REVOGADO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selo'
              example:
                id_selo: CERT-2026-998
                ong_id: ong-123
                status_conformidade: REVOGADO
                emitido_em: "2026-10-10T14:00:00Z"
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Selo já revogado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OngId:
      name: ongId
      in: path
      required: true
      schema:
        type: string
        example: ong-123
    SolicitacaoId:
      name: solicitacaoId
      in: path
      required: true
      schema:
        type: string
        example: sol-998
    SeloId:
      name: seloId
      in: path
      required: true
      schema:
        type: string
        example: CERT-2026-998
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    StatusConformidade:
      type: string
      enum: [ATIVO, REVOGADO]
    EstadoSolicitacao:
      type: string
      enum: [SOLICITADA, SELO_EMITIDO, COMPENSADA]
    Link:
      type: object
      required: [href]
      properties:
        href:
          type: string
        method:
          type: string
    EventoSaga:
      type: object
      required: [evento, servico, sucesso]
      properties:
        evento:
          type: string
          enum: [DIAGNOSTICO_CONCLUIDO, TAREFAS_REMEDIADAS, SELO_GERADO]
        servico:
          type: string
          enum: [audit-service, task-service, badge-service]
        sucesso:
          type: boolean
    NovaSolicitacao:
      type: object
      required: [ong_id, diagnostico_id, plano_id]
      properties:
        ong_id:
          type: string
        diagnostico_id:
          type: string
        plano_id:
          type: string
    Solicitacao:
      type: object
      required: [solicitacao_id, ong_id, estado, historico_saga_emissao, _links]
      properties:
        solicitacao_id:
          type: string
        ong_id:
          type: string
        diagnostico_id:
          type: string
        plano_id:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoSolicitacao'
        id_selo:
          type: string
          nullable: true
        historico_saga_emissao:
          type: array
          items:
            $ref: '#/components/schemas/EventoSaga'
        _links:
          type: object
          required: [self]
          properties:
            self:
              $ref: '#/components/schemas/Link'
            consulta_publica:
              $ref: '#/components/schemas/Link'
            certificacao:
              $ref: '#/components/schemas/Link'
            revogar:
              $ref: '#/components/schemas/Link'
            compensar:
              $ref: '#/components/schemas/Link'
    ConsultaPublica:
      type: object
      required: [id_selo, ong_id, nome_instituicao, status_conformidade, emitido_em, mensagem]
      properties:
        id_selo:
          type: string
        ong_id:
          type: string
        nome_instituicao:
          type: string
        status_conformidade:
          $ref: '#/components/schemas/StatusConformidade'
        emitido_em:
          type: string
          format: date-time
        mensagem:
          type: string
    Certificacao:
      type: object
      required: [id_selo, ong_id, status_conformidade, historico_saga_emissao]
      properties:
        id_selo:
          type: string
        ong_id:
          type: string
        status_conformidade:
          $ref: '#/components/schemas/StatusConformidade'
        emitido_em:
          type: string
          format: date-time
        historico_saga_emissao:
          type: array
          items:
            $ref: '#/components/schemas/EventoSaga'
    Selo:
      type: object
      required: [id_selo, ong_id, status_conformidade]
      properties:
        id_selo:
          type: string
        ong_id:
          type: string
        status_conformidade:
          $ref: '#/components/schemas/StatusConformidade'
        emitido_em:
          type: string
          format: date-time
    Erro:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    RequisicaoInvalida:
      description: Corpo inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: JWT ausente ou inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Solicitação ou selo não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Erro'
security:
  - bearerAuth: []
