apiVersion: v1
kind: Service
metadata:
  name: org-db
  namespace: ongsec
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: org-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: org-db
  namespace: ongsec
spec:
  serviceName: org-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: org-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: org-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: org_db
            - name: POSTGRES_USER
              value: ongsec
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: org-db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
