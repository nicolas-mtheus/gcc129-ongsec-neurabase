services:
  # =========================================================================
  # 1. API Gateway (Borda - Ponto único de entrada externo)
  # =========================================================================
  gateway:
    build:
      context: ../../gateway/nginx
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    networks:
      - edge
    depends_on:
      - bff-gestao
      - bff-publico
      - web-gestao
      - mobile-publico
    restart: unless-stopped

  # =========================================================================
  # 2. Painel Web de Gestão e Portal Mobile Público (Frontends SPA)
  # =========================================================================
  web-gestao:
    build:
      context: ../../frontend/web-gestao
      dockerfile: Dockerfile
    container_name: web-gestao
    networks:
      - edge
    restart: unless-stopped

  mobile-publico:
    build:
      context: ../../frontend/mobile-publico
      dockerfile: Dockerfile
    container_name: mobile-publico
    networks:
      - edge
    restart: unless-stopped

  # =========================================================================
  # 3. BFFs (Backend for Frontend)
  # =========================================================================
  bff-gestao:
    build:
      context: ../../backend/bffs/gestao
      dockerfile: Dockerfile
    container_name: bff-gestao
    networks:
      - edge
      - app
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ongsec-secret-key-2026}
      - JWT_ALGORITHM=HS256
      - MOCK_FALLBACK=false
      - REDIS_URL=redis://redis:6379/0
      - ORG_SERVICE_URL=http://org-service:8000
      - AUDIT_SERVICE_URL=http://audit-service:8000
      - TASK_SERVICE_URL=http://task-service:8000
      - BADGE_SERVICE_URL=http://badge-service:8000
      - SAGA_ORCHESTRATOR_URL=http://saga-orchestrator:8000
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - redis
      - org-service
      - audit-service
      - task-service
      - badge-service
      - saga-orchestrator
      - ai-service
    restart: unless-stopped

  bff-publico:
    build:
      context: ../../backend/bffs/publico
      dockerfile: Dockerfile
    container_name: bff-publico
    networks:
      - edge
      - app
    environment:
      - MOCK_FALLBACK=false
      - BADGE_SERVICE_URL=http://badge-service:8000
    depends_on:
      - badge-service
    restart: unless-stopped

  # =========================================================================
  # 4. Microsserviços de Domínio e seus respectivos bancos PostgreSQL
  # =========================================================================

  # --- ORG-SERVICE & ORG-DB ---
  org-db:
    image: postgres:16-alpine
    container_name: org-db
    environment:
      POSTGRES_USER: ongsec
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-ongsec_local_dev}
      POSTGRES_DB: org_db
    volumes:
      - org_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ongsec -d org_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - org-data
    restart: unless-stopped

  org-service:
    build:
      context: ../../backend/services/org-service
      dockerfile: Dockerfile
    container_name: org-service
    environment:
      - DATABASE_URL=postgresql+psycopg://ongsec:${LOCAL_DB_PASSWORD:-ongsec_local_dev}@org-db:5432/org_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ongsec-secret-key-2026}
      - JWT_ALGORITHM=HS256
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin123}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      org-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - org-data
    restart: unless-stopped

  # --- AUDIT-SERVICE & AUDIT-DB ---
  audit-db:
    image: postgres:16-alpine
    container_name: audit-db
    environment:
      POSTGRES_USER: ongsec
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-ongsec_local_dev}
      POSTGRES_DB: audit_db
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ongsec -d audit_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - audit-data
    restart: unless-stopped

  audit-service:
    build:
      context: ../../backend/services/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    environment:
      - DATABASE_URL=postgresql+psycopg://ongsec:${LOCAL_DB_PASSWORD:-ongsec_local_dev}@audit-db:5432/audit_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ongsec-secret-key-2026}
      - JWT_ALGORITHM=HS256
    depends_on:
      audit-db:
        condition: service_healthy
    networks:
      - app
      - audit-data
    restart: unless-stopped

  # --- TASK-SERVICE & TASK-DB ---
  task-db:
    image: postgres:16-alpine
    container_name: task-db
    environment:
      POSTGRES_USER: ongsec
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-ongsec_local_dev}
      POSTGRES_DB: task_db
    volumes:
      - task_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ongsec -d task_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - task-data
    restart: unless-stopped

  task-service:
    build:
      context: ../../backend/services/task-service
      dockerfile: Dockerfile
    container_name: task-service
    environment:
      - DATABASE_URL=postgresql+psycopg2://ongsec:${LOCAL_DB_PASSWORD:-ongsec_local_dev}@task-db:5432/task_db
      - SEED_DEMO=true
    depends_on:
      task-db:
        condition: service_healthy
    networks:
      - app
      - task-data
    restart: unless-stopped

  # --- BADGE-SERVICE & BADGE-DB ---
  badge-db:
    image: postgres:16-alpine
    container_name: badge-db
    environment:
      POSTGRES_USER: ongsec
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-ongsec_local_dev}
      POSTGRES_DB: badge_db
    volumes:
      - badge_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ongsec -d badge_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - badge-data
    restart: unless-stopped

  badge-service:
    build:
      context: ../../backend/services/badge-service
      dockerfile: Dockerfile
    container_name: badge-service
    environment:
      - DATABASE_URL=postgresql+psycopg2://ongsec:${LOCAL_DB_PASSWORD:-ongsec_local_dev}@badge-db:5432/badge_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      badge-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - badge-data
    restart: unless-stopped

  # --- REDIS (Broker de Eventos Outbox/CQRS e Revogação de Sessões JWT) ---
  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app
    restart: unless-stopped

  # --- SAGA-ORCHESTRATOR (Orquestrador dedicado fora dos serviços de domínio) ---
  saga-orchestrator:
    build:
      context: ../../backend/services/saga-orchestrator
      dockerfile: Dockerfile
    container_name: saga-orchestrator
    environment:
      - DATABASE_URL=sqlite:////app/data/saga_orchestrator.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ongsec-secret-key-2026}
      - ORG_SERVICE_URL=http://org-service:8000
      - AUDIT_SERVICE_URL=http://audit-service:8000
      - TASK_SERVICE_URL=http://task-service:8000
      - BADGE_SERVICE_URL=http://badge-service:8000
    volumes:
      - saga_db_data:/app/data
    depends_on:
      - org-service
      - audit-service
      - task-service
      - badge-service
    networks:
      - app
    restart: unless-stopped

  # --- AI-SERVICE (RAG + LangChain + Ollama DeepHat + Resiliência Distribuída) ---
  ai-service:
    build:
      context: ../../backend/services/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deephat:latest}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ongsec-secret-key-2026}
      - ORG_SERVICE_URL=http://org-service:8000
      - AUDIT_SERVICE_URL=http://audit-service:8000
      - TASK_SERVICE_URL=http://task-service:8000
      - BADGE_SERVICE_URL=http://badge-service:8000
    depends_on:
      - org-service
      - audit-service
      - task-service
      - badge-service
    networks:
      - app
    restart: unless-stopped

# =========================================================================
# Redes com isolamento entre camadas (Borda, Aplicação e Bancos Isolados)
# =========================================================================
networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  org-data:
    internal: true
  audit-data:
    internal: true
  task-data:
    internal: true
  badge-data:
    internal: true

# =========================================================================
# Volumes persistentes para os quatro bancos de dados
# =========================================================================
volumes:
  org_db_data: {}
  audit_db_data: {}
  task_db_data: {}
  badge_db_data: {}
  saga_db_data: {}
