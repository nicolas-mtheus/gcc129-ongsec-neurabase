user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'correlation_id="$correlation_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ==============================================================================
    # Defesa de Borda: Políticas de Rate Limiting por IP (docs/gateway-bffs.md)
    # Protege contra abuso e ataques DoS nas rotas públicas e administrativas.
    # ==============================================================================
    limit_req_zone $binary_remote_addr zone=publico_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=gestao_limit:10m rate=30r/s;
    limit_req_status 429;

    # ==============================================================================
    # 👉 [MOSTRAR NO VÍDEO 1]: INJEÇÃO DE RASTREABILIDADE DISTRIBUÍDA (X-Correlation-ID)
    # Se o cliente já enviar um header X-Correlation-ID, o Nginx preserva e repassa.
    # Se não enviar, o Gateway gera um identificador único ($request_id) e injeta
    # na requisição para rastrear ponta a ponta no BFF Gestão, BFF Público e Serviços.
    # ==============================================================================
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # ==============================================================================
    # Upstreams internos dos microsserviços na rede interna Docker / K8s:
    # ==============================================================================
    upstream web_gestao_backend {
        server web-gestao:80;
    }

    upstream bff_gestao_backend {
        server bff-gestao:8000;
    }

    upstream bff_publico_backend {
        server bff-publico:8000;
    }

    server {
        # ==============================================================================
        # 👉 [MOSTRAR NO VÍDEO 2]: ESCUTA NA PORTA 80 INTERNA DO CONTAINER
        # O Gateway escuta internamente na porta 80.
        # No docker-compose.yml ela é publicada para o host na porta 8080 (8080:80),
        # funcionando como PONTO ÚNICO DE ENTRADA HTTP de toda a aplicação.
        # ==============================================================================
        listen 80;
        server_name localhost;
        absolute_redirect off;

        # Cabeçalhos de Segurança de Borda
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # ==============================================================================
        # 👉 [MOSTRAR NO VÍDEO 3]: BLOCO DE HEALTHCHECK DE BORDA (GET /healthz)
        # Responde HTTP 200 imediatamente com JSON sem repassar aos backends.
        # Utilizado por balanceadores, orquestradores (Kubernetes liveness/readiness)
        # e monitoramento para atestar que o Gateway está operando e saudável.
        # ==============================================================================
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"healthy"}';
        }

        # ==============================================================================
        # 👉 [MOSTRAR NO VÍDEO 4]: ROTEAMENTO REVERSO DO PAINEL WEB (/gestao/)
        # Encaminha as requisições de interface gráfica para o container web-gestao:80.
        # Propaga o correlation_id e remove o prefixo /gestao/ ao passar para o upstream.
        # ==============================================================================
        location /gestao/ {
            proxy_pass http://web_gestao_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            add_header X-Correlation-ID $correlation_id always;
        }

        # Redirecionamento amigável caso o usuário digite /gestao sem a barra final
        location = /gestao {
            return 301 /gestao/;
        }

        # ==============================================================================
        # 👉 [MOSTRAR NO VÍDEO 5]: ROTEAMENTO REVERSO DO BFF GESTÃO (/api/gestao/*)
        # Encaminha para o BFF Gestão interno (http://bff-gestao:8000).
        # Aplica Rate Limiting (zona gestao_limit) e repassa os headers de autenticação
        # JWT para que o BFF valide a identidade do gestor da ONG.
        # ==============================================================================
        location /api/gestao/ {
            limit_req zone=gestao_limit burst=50 nodelay;

            proxy_pass http://bff_gestao_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            add_header X-Correlation-ID $correlation_id always;
        }

        # ==============================================================================
        # 👉 [MOSTRAR NO VÍDEO 6]: ROTEAMENTO REVERSO DO BFF PÚBLICO (/api/publico/*)
        # Encaminha para o BFF Público interno (http://bff-publico:8000).
        # Permite consulta anônima de selos (sem JWT), aplicando Rate Limiting mais
        # restrito (zona publico_limit) para proteção da infraestrutura contra scrapping.
        # ==============================================================================
        location /api/publico/ {
            limit_req zone=publico_limit burst=20 nodelay;

            proxy_pass http://bff_publico_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            add_header X-Correlation-ID $correlation_id always;
        }
    }
}
